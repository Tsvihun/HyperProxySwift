name: Package CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test package
        run: swift test
      - name: Compile Quick Start example
        run: swift build --package-path Examples/QuickStart
      - name: Build every product for iOS Simulator
        run: >-
          xcodebuild
          -scheme HyperProxySwift-Package
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
      - name: Compile the physical-device security probe
        run: >-
          xcodebuild
          -project Examples/DeviceSecurityProbe/DeviceSecurityProbe.xcodeproj
          -scheme DeviceSecurityProbe
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO

  cocoapods:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Lint aggregate and component pods
        run: >-
          bundle exec pod lib lint HyperProxy.podspec
          --include-podspecs='HyperProxy*.podspec'
          --platforms=ios
          --fail-fast
