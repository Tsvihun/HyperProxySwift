name: Package CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'prelaunch/**'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated artifact inventory
        run: node Scripts/check_release_provenance.mjs
      - name: Validate runtime and CocoaPods release versions
        run: python3 Scripts/check_release_versions.py
      - name: Validate Swift filenames, declarations, and headers
        run: |
          python3 -m unittest discover -s Scripts -p 'test_swift_layout.py'
          python3 Scripts/check_swift_layout.py
      - name: Require redistribution review before a tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: node Scripts/check_release_provenance.mjs --release
      - name: Check handwritten Swift style
        run: python3 Scripts/check_swift_style.py
      - name: Test package
        run: swift test --disable-index-store
      - name: Typecheck README and every Swift documentation guide
        run: node Scripts/check_readme_examples.mjs
      - name: Compile Quick Start example
        run: swift build --package-path Examples/QuickStart --scratch-path .build --disable-index-store
      - name: Test Playground request and transport models
        run: swift test --package-path Examples/Playground --scratch-path .build --disable-index-store

  ios:
    name: iOS / ${{ matrix.scheme }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: HyperProxySwift-Package
            project: ''
          - scheme: DeviceSecurityProbe
            project: Examples/DeviceSecurityProbe/DeviceSecurityProbe.xcodeproj
          - scheme: Playground
            project: Examples/Playground/Playground.xcodeproj
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode-cache
        with:
          scope: ios-${{ matrix.scheme }}
      - name: Build for iOS Simulator
        env:
          BUILD_SCHEME: ${{ matrix.scheme }}
          BUILD_PROJECT: ${{ matrix.project }}
        run: |
          project_args=()
          if [[ -n "$BUILD_PROJECT" ]]; then
            project_args=(-project "$BUILD_PROJECT")
          fi
          xcodebuild "${project_args[@]}" \
            -scheme "$BUILD_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary

  cocoapods:
    name: CocoaPods / ${{ matrix.architecture }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode-cache
        with:
          scope: pods-release-${{ matrix.architecture }}
          architecture: ${{ matrix.architecture }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Lint aggregate and component pods
        run: >-
          bundle exec pod lib lint HyperProxy.podspec
          --include-podspecs='HyperProxy*.podspec'
          --platforms=ios
          --configuration=Release
          --validation-dir="$GITHUB_WORKSPACE/.ci/CocoaPodsValidation"
          --fail-fast
          --verbose
